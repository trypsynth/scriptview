name: Release

on:
  push:
    tags: ["v*"]
  # A manual run builds, signs and notarizes everything without publishing,
  # to test the signing setup.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - name: Build for Linux and Windows
        run: |
          VERSION=${GITHUB_REF_NAME}
          mkdir dist
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            name=scriptview-${VERSION}-${os}-${arch}
            ext=""; [ "$os" = windows ] && ext=.exe
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "build/$name/scriptview$ext" ./cmd/scriptview
            cp README.md LICENSE "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -czf "dist/$name.tar.gz" -C build "$name"
            fi
          done
      - name: Smoke test the Linux binary
        run: |
          out=$(build/scriptview-${GITHUB_REF_NAME}-linux-amd64/scriptview testdata/scpt/hello.scpt)
          [ "$out" = 'display dialog "hello world"' ] || { echo "unexpected output: $out" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist-other
          path: dist/*

  smoke-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist-other
          path: dist
      - name: Smoke test the Windows binary
        shell: bash
        run: |
          cd dist && unzip -q "scriptview-${GITHUB_REF_NAME}-windows-amd64.zip" && cd ..
          out=$(dist/scriptview-${GITHUB_REF_NAME}-windows-amd64/scriptview.exe testdata/scpt/hello.scpt | tr -d '\r')
          [ "$out" = 'display dialog "hello world"' ] || { echo "unexpected output: $out" >&2; exit 1; }

  build-macos:
    runs-on: macos-latest
    # Signing and notarization run only when their secrets are set. Without
    # them the binaries still build, and people have to clear the quarantine
    # flag before macOS runs them.
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build for macOS
        run: |
          VERSION=${GITHUB_REF_NAME}
          for arch in amd64 arm64; do
            name=scriptview-${VERSION}-darwin-${arch}
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "build/$name/scriptview" ./cmd/scriptview
            cp README.md LICENSE "build/$name/"
          done
      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE_P12_BASE64 != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity found in the imported certificate" >&2
            exit 1
          fi
          echo "Found signing identity: $IDENTITY"
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          rm -f "$CERT_PATH"
      - name: Sign
        if: env.MACOS_CERTIFICATE_P12_BASE64 != ''
        run: |
          for bin in build/*/scriptview; do
            codesign --force --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" "$bin"
            codesign --verify --strict --verbose=2 "$bin"
          done
      - name: Notarize
        if: env.MACOS_CERTIFICATE_P12_BASE64 != '' && env.APPSTORE_API_KEY_BASE64 != ''
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          # Command-line tools can't be stapled. Apple notarizes them inside a
          # zip, and macOS checks with Apple online the first time one runs.
          KEY_ID=$(printf '%s' "$APPSTORE_API_KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(printf '%s' "$APPSTORE_API_ISSUER_ID" | tr -d '[:space:]')
          KEY_PATH="$RUNNER_TEMP/AppStoreConnectAPIKey.p8"
          echo "$APPSTORE_API_KEY_BASE64" | base64 -D -o "$KEY_PATH"
          ditto -c -k build notarize.zip
          set +e
          xcrun notarytool submit notarize.zip \
            --key "$KEY_PATH" --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
            --wait --output-format json | tee notarization-result.json
          SUBMIT_STATUS=$?
          set -e
          SUBMISSION_ID=$(jq -r '.id // empty' notarization-result.json)
          RESULT=$(jq -r '.status // empty' notarization-result.json)
          if [ "$SUBMIT_STATUS" -ne 0 ] || [ "$RESULT" != "Accepted" ]; then
            echo "Notarization failed (exit $SUBMIT_STATUS, status '$RESULT')"
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" --key "$KEY_PATH" --key-id "$KEY_ID" --issuer "$ISSUER_ID"
            fi
            rm -f "$KEY_PATH"
            exit 1
          fi
          rm -f "$KEY_PATH"
      - name: Clean up signing keychain
        if: always()
        run: |
          if [ -n "$MACOS_KEYCHAIN_PATH" ] && [ -f "$MACOS_KEYCHAIN_PATH" ]; then
            security delete-keychain "$MACOS_KEYCHAIN_PATH" || true
          fi
      - name: Smoke test the macOS binary
        run: |
          out=$(build/scriptview-${GITHUB_REF_NAME}-darwin-arm64/scriptview testdata/scpt/hello.scpt)
          [ "$out" = 'display dialog "hello world"' ] || { echo "unexpected output: $out" >&2; exit 1; }
      - name: Package
        run: |
          mkdir dist
          for dir in build/*/; do
            name=$(basename "$dir")
            tar -czf "dist/$name.tar.gz" -C build "$name"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-macos, smoke-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: (cd dist && sha256sum * > checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=""
          [ -f "release-notes/$GITHUB_REF_NAME.md" ] && NOTES="--notes-file release-notes/$GITHUB_REF_NAME.md"
          if [ -z "$NOTES" ]; then NOTES="--generate-notes"; fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" $NOTES
